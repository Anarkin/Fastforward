name: Scales

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scales:
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5', '1.75']
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      FASTFORWARD_TEST_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: Add-MpPreference -ExclusionPath $env:TEMP, $env:GITHUB_WORKSPACE
        shell: pwsh
      - name: Give the screen 1920 by 1080 pixels
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --project electron
